CONFIG_GPIO=y

# Enable C++ support for Edge Impulse library
CONFIG_CPP=y
CONFIG_LIB_CPLUSPLUS=y

# Memory configuration - ensure sufficient heap for Edge Impulse
# The model requires ~3KB arena (EI_CLASSIFIER_TFLITE_LARGEST_ARENA_SIZE = 2944)
# Add extra heap for signal processing and other operations
CONFIG_HEAP_MEM_POOL_SIZE=8192

# Enable floating point support (required for Edge Impulse)
# Note: nRF52840 has hardware FPU, nRF52832 uses software FPU
# If using nRF52832, remove CONFIG_FPU=y and use software FPU
CONFIG_FPU=y

# Enable printf for debug output
CONFIG_PRINTK=y
CONFIG_STDOUT_CONSOLE=y

# C++ standard library support (minimal for embedded)
CONFIG_NEWLIB_LIBC=y